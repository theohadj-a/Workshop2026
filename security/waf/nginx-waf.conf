# Zone de Rate Limiting WAF (protection contre DoS / Brute Force)
limit_req_zone $binary_remote_addr zone=waf_api_limit:10m rate=15r/s;
limit_req_zone $binary_remote_addr zone=waf_payment_limit:10m rate=5r/s;

# Détection de User-Agents malveillants ou scanners connus
map $http_user_agent $bad_bot {
    default 0;
    ~*(nikto|sqlmap|nmap|dirbuster|gobuster|wprecon) 1;
}

server {
    listen 80;
    server_name localhost;

    # Variables de résolution DNS pour supporter K8s et Docker Compose
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $upstream_payment "resilience-payment-api:8000";
    set $upstream_remediation "resilience-remediation-engine:8001";
    set $upstream_auth "resilience-auth-service:8002";

    # Bloquer immédiatement les scanners malveillants détectés par le WAF
    if ($bad_bot) {
        return 403 "Blocked by WAF Rule: Malicious User-Agent detected";
    }

    # En-têtes de durcissement de sécurité HTTP (Recommandation ANSSI / OWASP)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Frontend Single Page Application
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Protection WAF spécifique sur les soumissions de paiements
    location /api/v1/payments {
        limit_req zone=waf_payment_limit burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://$upstream_payment;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    # Proxy pour le microservice d'authentification (Supervision SOC)
    location /api/v1/auth/ {
        proxy_pass http://$upstream_auth/api/v1/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy pour le reste des routes API avec Rate Limiting modéré
    location /api/ {
        limit_req zone=waf_api_limit burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://$upstream_payment;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy pour le healthcheck (sans rate limiting pour les sondes K8s)
    location /health {
        proxy_pass http://$upstream_payment;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy vers le moteur de remédiation
    location /remediation/ {
        proxy_pass http://$upstream_remediation/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
