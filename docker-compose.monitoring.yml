services:
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: resilience-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./infra/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - resilience-net

  grafana:
    image: grafana/grafana:11.1.0
    container_name: resilience-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./infra/monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - resilience-net
    depends_on:
      - prometheus

networks:
  resilience-net:
    external: true
