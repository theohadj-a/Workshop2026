services:
  payment-api:
    build:
      context: ./services/payment-api
      dockerfile: Dockerfile
    container_name: resilience-payment-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - SERVICE_NAME=payment-api
      - PORT=8000
      - DB_PATH=/app/data/payments.db
    volumes:
      - payment_data:/app/data
    networks:
      - resilience-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; exit(0 if urllib.request.urlopen('http://localhost:8000/health').getcode() == 200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  remediation-engine:
    build:
      context: ./services/remediation-engine
      dockerfile: Dockerfile
    container_name: resilience-remediation-engine
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - SERVICE_NAME=remediation-engine
      - PORT=8001
      - PAYMENT_API_URL=http://resilience-payment-api:8000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - resilience-net
    depends_on:
      payment-api:
        condition: service_healthy

  dashboard-ui:
    build:
      context: ./services/dashboard-ui
      dockerfile: Dockerfile
    container_name: resilience-dashboard-ui
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      - resilience-net
    depends_on:
      - payment-api

networks:
  resilience-net:
    driver: bridge

volumes:
  payment_data:
