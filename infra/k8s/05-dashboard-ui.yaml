apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard-ui
  namespace: resilience-alpha
  labels:
    app: dashboard-ui
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dashboard-ui
  template:
    metadata:
      labels:
        app: dashboard-ui
        tier: frontend
    spec:
      containers:
        - name: dashboard-ui
          image: dashboard-ui:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard-ui-service
  namespace: resilience-alpha
  labels:
    app: dashboard-ui
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
      name: http
  selector:
    app: dashboard-ui
