apiVersion: v1
kind: ServiceAccount
metadata:
  name: remediation-engine-sa
  namespace: resilience-alpha
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: remediation-role
  namespace: resilience-alpha
rules:
  - apiGroups: ["", "apps"]
    resources: ["pods", "deployments"]
    verbs: ["get", "list", "watch", "delete", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: remediation-rolebinding
  namespace: resilience-alpha
subjects:
  - kind: ServiceAccount
    name: remediation-engine-sa
    namespace: resilience-alpha
roleRef:
  kind: Role
  name: remediation-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: remediation-engine
  namespace: resilience-alpha
  labels:
    app: remediation-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: remediation-engine
  template:
    metadata:
      labels:
        app: remediation-engine
    spec:
      serviceAccountName: remediation-engine-sa
      containers:
        - name: remediation-engine
          image: remediation-engine:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
              name: http
          env:
            - name: SERVICE_NAME
              value: "remediation-engine"
            - name: PORT
              value: "8001"
            - name: K8S_NAMESPACE
              value: "resilience-alpha"
            - name: PAYMENT_API_URL
              value: "http://payment-api-service:8000"
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: remediation-service
  namespace: resilience-alpha
  labels:
    app: remediation-engine
spec:
  type: ClusterIP
  ports:
    - port: 8001
      targetPort: 8001
      protocol: TCP
      name: http
  selector:
    app: remediation-engine
