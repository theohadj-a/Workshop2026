apiVersion: v1
kind: Service
metadata:
  name: dashboard-ui-service
  namespace: {{ .Values.global.namespace }}
  labels:
    app: dashboard-ui
    {{- include "resilience-alpha.labels" . | nindent 4 }}
spec:
  type: {{ .Values.dashboardUi.service.type }}
  ports:
    - port: {{ .Values.dashboardUi.service.port }}
      targetPort: 80
      {{- if and (eq .Values.dashboardUi.service.type "NodePort") .Values.dashboardUi.service.nodePort }}
      nodePort: {{ .Values.dashboardUi.service.nodePort }}
      {{- end }}
      protocol: TCP
      name: http
  selector:
    app: dashboard-ui
