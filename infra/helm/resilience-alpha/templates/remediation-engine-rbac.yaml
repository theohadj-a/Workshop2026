apiVersion: v1
kind: ServiceAccount
metadata:
  name: remediation-engine-sa
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "resilience-alpha.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: remediation-role
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "resilience-alpha.labels" . | nindent 4 }}
rules:
  - apiGroups: ["", "apps"]
    resources: ["pods", "deployments"]
    verbs: ["get", "list", "watch", "delete", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: remediation-rolebinding
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "resilience-alpha.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: remediation-engine-sa
    namespace: {{ .Values.global.namespace }}
roleRef:
  kind: Role
  name: remediation-role
  apiGroup: rbac.authorization.k8s.io
