apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-ui-nginx-conf
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "resilience-alpha.labels" . | nindent 4 }}
data:
  default.conf: |
    limit_req_zone $binary_remote_addr zone=waf_api_limit:10m rate=15r/s;
    limit_req_zone $binary_remote_addr zone=waf_payment_limit:10m rate=5r/s;

    map $http_user_agent $bad_bot {
        default 0;
        ~*(nikto|sqlmap|nmap|dirbuster|gobuster|wprecon) 1;
    }

    server {
        listen 80;
        server_name localhost;

        if ($bad_bot) {
            return 403 "Blocked by Resilience WAF Rule: Malicious User-Agent detected\n";
        }

        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        location /api/v1/payments {
            limit_req zone=waf_payment_limit burst=10 nodelay;
            limit_req_status 429;

            proxy_pass http://payment-api-service:8000/api/v1/payments;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/ {
            limit_req zone=waf_api_limit burst=20 nodelay;
            limit_req_status 429;

            proxy_pass http://payment-api-service:8000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /health {
            proxy_pass http://payment-api-service:8000/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /remediation/ {
            proxy_pass http://remediation-service:8001/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
