# Default values for resilience-alpha Helm Chart.
# Ce fichier permet de paramétrer tous les composants du cluster sans toucher aux manifestes.

global:
  namespace: resilience-alpha
  noReplica: false

# 1. API de Paiement Métier (Microservice)
paymentApi:
  replicaCount: 3
  image:
    repository: payment-api
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8000
  env:
    serviceName: payment-api
    port: 8000
    dbPath: /app/data/payments.db
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  livenessProbe:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 10
  readinessProbe:
    path: /health
    initialDelaySeconds: 3
    periodSeconds: 5
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70

# 2. Interface Dashboard & Terminal de Paiement (React)
dashboardUi:
  replicaCount: 2
  image:
    repository: dashboard-ui
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: NodePort
    port: 80
    nodePort: 30080
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# 3. Moteur de Remédiation Autonome (Zero-Touch)
remediationEngine:
  replicaCount: 1
  image:
    repository: remediation-engine
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8001
  env:
    serviceName: remediation-engine
    port: 8001
    paymentApiUrl: http://payment-api-service:8000
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# 4. Détecteur d'Anomalies AIOps (Machine Learning)
aiopsDetector:
  replicaCount: 1
  image:
    repository: aiops-detector
    tag: latest
    pullPolicy: IfNotPresent
  env:
    paymentApiUrl: http://payment-api-service:8000
    remediationWebhookUrl: http://remediation-service:8001/api/v1/remediation/alert
    checkIntervalSec: 3.0
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# 5. Ingress Controller (Accès HTTP sans port-forward)
ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  hosts:
    - host: resilience.local
      paths:
        - path: /
          pathType: Prefix
    - host: localhost
      paths:
        - path: /
          pathType: Prefix

# 6. Politiques de Cybersécurité
networkPolicy:
  enabled: true
