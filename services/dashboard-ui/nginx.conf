# =========================================================================
# WAF & Reverse Proxy Configuration — PROJECT RESILIENCE-ALPHA
# Protection applicative : Rate Limiting, User-Agent filtering, Security Headers
# =========================================================================

# Zone de Rate Limiting WAF (protection contre DoS / Brute Force)
limit_req_zone $binary_remote_addr zone=waf_api_limit:10m rate=15r/s;
limit_req_zone $binary_remote_addr zone=waf_payment_limit:10m rate=5r/s;

# Détection de User-Agents suspects ou scanners connus (OWASP Top 10)
map $http_user_agent $bad_bot {
    default 0;
    ~*(nikto|sqlmap|nmap|dirbuster|gobuster|wprecon) 1;
}

server {
    listen 80;
    server_name localhost;

    # Bloquer immédiatement les scanners malveillants identifiés
    if ($bad_bot) {
        return 403 "Blocked by Resilience WAF Rule: Malicious User-Agent detected\n";
    }

    # En-têtes de durcissement de sécurité HTTP (Recommandations ANSSI / OWASP)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Frontend Single Page Application
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Protection WAF spécifique sur les soumissions de transactions bancaires
    location /api/v1/payments {
        limit_req zone=waf_payment_limit burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://resilience-payment-api:8000/api/v1/payments;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    # Proxy pour le reste des routes API avec Rate Limiting modéré
    location /api/ {
        limit_req zone=waf_api_limit burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://resilience-payment-api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Alias vers la documentation Swagger (/api/docs et /api/v1/docs redirigent vers /docs)
    location = /api/docs {
        return 301 /docs;
    }

    location = /api/v1/docs {
        return 301 /docs;
    }

    # Proxy vers l'API Swagger Docs et OpenAPI
    location /docs {
        proxy_pass http://resilience-payment-api:8000/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /openapi.json {
        proxy_pass http://resilience-payment-api:8000/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /redoc {
        proxy_pass http://resilience-payment-api:8000/redoc;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy pour le healthcheck (sans rate limiting pour les sondes)
    location /health {
        proxy_pass http://resilience-payment-api:8000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Exposition des métriques Prometheus
    location /metrics {
        proxy_pass http://resilience-payment-api:8000/metrics;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /api/metrics {
        return 301 /metrics;
    }

    location = /api/v1/metrics {
        return 301 /metrics;
    }

    # Proxy vers le moteur de remédiation
    location /remediation/ {
        proxy_pass http://resilience-remediation-engine:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
